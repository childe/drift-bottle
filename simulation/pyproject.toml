[project]
name = "drift-bottle-simulation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "copernicusmarine>=2",
  "xarray>=2024",
  "numpy>=2",
  "h5netcdf>=1",
  "requests>=2",
  "pillow>=10.1",
]

[dependency-groups]
dev = ["pytest>=8", "black>=24"]

[tool.pytest.ini_options]
pythonpath = ["."]
